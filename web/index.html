<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Neon Pong</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 640px;
            margin-bottom: 20px;
        }

        .score-box h2 {
            margin: 0;
            font-size: 1rem;
            text-transform: uppercase;
        }

        .score-box .score {
            font-size: 2rem;
            font-weight: bold;
        }

        #pause-indicator {
            font-weight: bold;
            display: none;
        }

        /* O canvas gerado pelo emscripten */
        canvas.emscripten {
            display: block;
            border: 2px solid #fff;
            outline: none;
            background-color: #000;
            max-width: 100vw;
            max-height: 80vh;
            object-fit: contain;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 40px;
            text-align: center;
        }

        .player-controls p {
            margin: 5px 0;
            font-size: 0.8rem;
        }

        .key {
            display: inline-block;
            border: 1px solid #fff;
            padding: 2px 6px;
        }

        /* Overlay de Loading */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
        }
    </style>
</head>
<body>



    <div class="game-container">
        <!-- Scoreboard HTML -->
        <div class="scoreboard" aria-live="polite">
            <div class="score-box">
                <h2>Player 1</h2>
                <div class="score" id="score1">0</div>
            </div>
            <div id="pause-indicator">PAUSADO</div>
            <div class="score-box">
                <h2>Player 2</h2>
                <div class="score" id="score2">0</div>
            </div>
        </div>
        
        <!-- Canvas para o OpenGL via Emscripten -->
        <div id="loading">Carregando Jogo...</div>
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" aria-label="Game Canvas"></canvas>
    </div>

    <div class="controls">
        <div class="player-controls">
            <h3>Player 1</h3>
            <p>Subir: <span class="key">W</span></p>
            <p>Descer: <span class="key">S</span></p>
        </div>
        <div class="player-controls" style="padding-left: 40px;">
            <h3>Geral</h3>
            <p>Pausar: <span class="key">Enter</span></p>
        </div>
        <div class="player-controls" style="padding-left: 40px;">
            <h3>Player 2</h3>
            <p>Subir: <span class="key">↑</span></p>
            <p>Descer: <span class="key">↓</span></p>
        </div>
    </div>

    <script>
        // Função para atualizar o placar vindo do C++
        let lastScore1 = 0;
        let lastScore2 = 0;
        window.updateScore = function(score1, score2, isPaused) {
            if (score1 !== lastScore1) {
                document.getElementById('score1').innerText = score1;
                lastScore1 = score1;
            }
            if (score2 !== lastScore2) {
                document.getElementById('score2').innerText = score2;
                lastScore2 = score2;
            }
            document.getElementById('pause-indicator').style.display = isPaused ? 'block' : 'none';
        };

        // Funções de Audio via Web Audio API injetadas no emscripten
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        window.playBeep = function(freq, durationMs) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine'; // som estilo retro
            oscillator.frequency.value = freq;
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            
            // Fade out para não estalar
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (durationMs / 1000));
            
            oscillator.stop(audioCtx.currentTime + (durationMs / 1000));
        };

        // Configuração do Emscripten Module
        var Module = {
            preRun: [],
            postRun: [
                function() {
                    document.getElementById('loading').style.display = 'none';
                    // Foca o canvas automaticamente
                    document.getElementById('canvas').focus();
                }
            ],
            print: (function() {
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                };
            })(),
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                return canvas;
            })(),
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                var now = Date.now();
                if (m && now - Module.setStatus.last.time < 30) return; 
                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;
                if (m) {
                    text = m[1];
                }
                if(text) {
                    document.getElementById('loading').innerText = text;
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparando... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'Iniciando...');
            }
        };
        Module.setStatus('Fazendo download...');
        window.onerror = function(event) {
            Module.setStatus('Exception thrown, see JavaScript console');
            Module.setStatus = function(text) {
                if (text) console.error('[post-exception status] ' + text);
            };
        };
    </script>
    <!-- O script gerado pelo emscripten -->
    <script async type="text/javascript" src="pong.js"></script>
</body>
</html>
